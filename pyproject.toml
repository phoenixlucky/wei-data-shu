[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wei-data-shu"
version = "0.10.0"
description = "wei-data-shu: 面向办公自动化和数据处理的 Python 工具库 | Domain-oriented office automation & data utility toolkit for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [
  {name = "Ethan Wilkins", email = "thisluckyboy@126.com"}
]
keywords = ["office", "excel", "word", "powerpoint", "markdown", "mysql", "email", "automation", "utilities"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "toml>=0.10",
  "requests>=2.31",
]

[project.scripts]
wei-data-shu = "wei_data_shu.cli:main"

[project.optional-dependencies]
excel = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]
database = [
  "mysql-connector-python>=8.0",
]
analysis = [
  "pandas>=2.0",
  "numpy",
  "matplotlib",
  "statsmodels",
  "jieba",
  "wordcloud",
  "openpyxl>=3.1"
]
excel-client = [
  "xlwings"
]
docs = [
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1"
]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
  "coverage>=7.6"
]

[project.urls]
Homepage = "https://github.com/phoenixlucky/wei-data-shu"
Repository = "https://github.com/phoenixlucky/wei-data-shu"
Issues = "https://github.com/phoenixlucky/wei-data-shu/issues"
Changelog = "https://github.com/phoenixlucky/wei-data-shu/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
wei_data_shu = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wei_data_shu*"]
exclude = ["tests*", "build*", "dist*", "*.egg-info*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# 不把 Markdown 里的示例代码块纳入格式化（README / USAGE 保留手工对齐的注释）
extend-exclude = ["build", "dist", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# 领域包 __init__ 里的 import_module 由惰性 __getattr__ 在运行时取用
"wei_data_shu/**/__init__.py" = ["F401"]
"tests/**/__init__.py" = ["F401"]

[tool.mypy]
# 用 3.12 作为类型检查目标：与 CI 的 mypy 作业一致，且能解析新版第三方存根
python_version = "3.12"
ignore_missing_imports = true
files = ["wei_data_shu"]
